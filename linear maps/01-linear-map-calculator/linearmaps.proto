syntax = "proto3";

package linearmaps;

service LinearMaps {
  rpc Apply (ApplyRequest) returns (ApplyResponse);     
  rpc Add (BinaryMapRequest) returns (MapResponse);     
  rpc Scale (ScaleRequest) returns (MapResponse);        
  rpc Compose (ComposeRequest) returns (MapResponse);   
  rpc SendZero (ZeroRequest) returns (ZeroResponse);    
}

message Matrix { repeated Row rows = 1; }
message Row { repeated double values = 1; }

message ApplyRequest  { Matrix map = 1; repeated double vector = 2; }
message ApplyResponse { repeated double result = 1; }

message BinaryMapRequest { Matrix first = 1; Matrix second = 2; }
message MapResponse      { Matrix result = 1; string note = 2; }

message ScaleRequest { Matrix map = 1; double scalar = 2; }
message ComposeRequest { Matrix outer = 1; Matrix inner = 2; } 
message ZeroRequest  { Matrix map = 1; }
message ZeroResponse { bool holds = 1; repeated double t_of_zero = 2; }